services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - postgres
    networks:
      - mintradar_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mintradar
      POSTGRES_USER: mintradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mintradar_pgdata:/var/lib/postgresql/data
    networks:
      - mintradar_net

networks:
  mintradar_net:
    driver: bridge

volumes:
  mintradar_pgdata:
