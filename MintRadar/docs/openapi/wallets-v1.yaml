openapi: 3.1.0
info:
  title: MintRadar API for wallets
  version: 1.0.0
  summary: Operational health of Cashu mints, one compact object per mint.
  description: |
    A small, stable, read-only API for wallet developers, served by https://mintradar.org.

    **Operational health signal, not solvency, not a recommendation to deposit funds. Based on
    MintRadar's probes and third-party audit data; it can be wrong or out of date.**

    **CORS.** Every route below answers any origin: `Access-Control-Allow-Origin: *` for `GET`, `HEAD`
    and `OPTIONS`, no credentials, with `Access-Control-Expose-Headers: ETag, Retry-After,
    X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Deprecation, Sunset, Link` (the last three let a
    browser wallet read a deprecation notice, since 2026-10-20). A preflight is answered with `204`.

    **Caching.** Every successful response carries `Cache-Control: public, max-age=300` and an
    `ETag` over the body (on a cache hit as well as a miss; strong, but a compressed answer carries the same
    value in the weak form `W/"..."`, so treat it as an opaque string). Send `If-None-Match` to get `304`. The data
    follows MintRadar's 5-minute probe cycle: poll at most every 5 minutes. Errors are not cached.

    **Rate limit.** 300 requests per minute per IP address, one counter shared by `/api/v1/wallets/*`
    and `/api/v1/mints/recommend` (the unversioned `/api/...` paths count the same; `/mints/recommend`
    is not part of this specification). Every response except a preflight carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
    `X-RateLimit-Reset`; a `429` carries `Retry-After` (seconds).

    **Stability.** Inside v1 a field is never renamed or removed and its type does not change; changes
    are additive, so clients must ignore fields they do not know. A removal is announced in
    docs/API.md and on mintradar.org/for-wallets at least 90 days before it takes effect. A route that is going away
    also sends `Deprecation`, `Sunset` and `Link: <successor>; rel="successor-version"` headers; the only such route
    is `/mints/recommend` (deprecated 2026-10-20, sunset 2027-01-26, not part of this specification): replace it with
    `/wallets/mints?eligible=true&unit=sat&minScore=80&nuts=4,5&limit=5`, which returns the same mints in the same
    order. The list parameters `nuts` and `eligible` were added on 2026-10-20 (additions), and so were, the same day, the
    list parameters `method`, `maxInputFeePpk` and `include`, the list fields `total` and `truncated`, the single-mint field
    `canonicalUrl` and the mint fields `pubkey`, `firstSeenAt`, `lastOnlineAt`, `downSince`, `hasOnion`, `authRequired`,
    `sample`, `auditNeutralReason`, `keysets`, `keysetsCheckedAt`, `methods` and `scoreBreakdown` (`pubkey`, `firstSeenAt`,
    `lastOnlineAt`, `sample` and the last four only with `include` or on the single-mint endpoint). The mint change log
    followed (also 2026-10-20): the mint field `changes` (single-mint endpoint and `include=changes`), the list parameter
    `changedSince` and the `include` value `changes`; the default list is unchanged. The mint field `contactChecks` followed
    (also 2026-10-20: single-mint endpoint and `include=facts`); the default list is unchanged. The mint fields `feeExamples`,
    `limits` and `auditByDirection` followed on 2026-10-21 (single-mint endpoint and `include=facts`); the default list is
    unchanged. The mint field `scoreStale` (true when `status` is not `online`) was added on 2026-10-21 on every object, the default list included. The integer
    `methodology` changes whenever the score formula changes; scores of different methodology numbers are
    not comparable. The history is in `backend/src/shared/methodology.ts` and docs/API.md.

    **Privacy.** Download the whole list and filter locally: a list request tells MintRadar nothing about which mint you
    care about. The single-mint endpoint tells MintRadar which mint you asked about. The responses never contain IP
    addresses, ASNs, hosting organisations, server locations or error messages.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://mintradar.org/api/v1
    description: Production. The same routes are served without the `v1` segment (`/api/wallets/...`).
security: []
tags:
  - name: Mints
    description: Health summary of tracked Cashu mints.
paths:
  /wallets/mints:
    get:
      operationId: listMints
      tags: [Mints]
      summary: List mints with their health summary
      description: |
        By default only online, scored, non-test mints are returned. Order: `score` descending (null last),
        then `uptime7dPct` descending (null last), then `name` (the hostname when `name` is null), then `url`.
        A query value that is present but invalid (a repeated parameter included; the boolean flags take exactly `true` or `false`) is a `400`; unknown parameters are ignored.
        `total` counts the mints that match the filters before `limit` is applied; `truncated` is true when `limit` cut the list.
        The heavier fields (`pubkey`, `firstSeenAt`, `lastOnlineAt`, `sample`, `contactChecks`, `feeExamples`, `limits`, `auditByDirection`, `keysets`, `keysetsCheckedAt`, `methods`, `scoreBreakdown`) are only in the objects when `include` asks for them.
      parameters:
        - name: unit
          in: query
          description: 'Keep mints that list this unit (case-insensitive). Mints with `units: null` never match. `units` and the `unit=` filter list the units for which the mint declares a payment method (NUT-04/05); units that appear only in keysets (`include=keysets`) are not included, so a mint with no declared methods has `units: null`.'
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,16}$' }
          example: sat
        - name: minScore
          in: query
          description: Keep mints with `score >= minScore`. A mint without a score never matches.
          schema: { type: integer, minimum: 0, maximum: 100 }
          example: 70
        - name: includeOffline
          in: query
          description: Also return `offline` and `degraded` mints (see `status` for the exact rule).
          schema: { type: boolean, default: false }
        - name: includeArchived
          in: query
          description: Also return `archived` mints (see `status`). This flag alone is enough for them.
          schema: { type: boolean, default: false }
        - name: includeTest
          in: query
          description: 'Also return mints from MintRadar''s manual test-mint list (`isTest: true`).'
          schema: { type: boolean, default: false }
        - name: includeUnscored
          in: query
          description: Also return mints whose `score` is null (not probed yet).
          schema: { type: boolean, default: false }
        - name: nuts
          in: query
          description: >-
            Comma-separated NUT numbers, for example `4,5`: keep mints that advertise all of them (compared with the
            `nuts` field, so a NUT with `supported: false` does not match; leading zeros are ignored). 1 to 32 numbers of 1 to 3 digits; anything else is a `400`. A mint
            with `nuts: null` never matches. Added 2026-10-20. Example: `nuts=11,12` keeps the mints that declare both
            NUT-11 (P2PK) and NUT-12 (DLEQ proofs), the two a Nutzap (NIP-61) relies on.
          schema: { type: string, pattern: '^ *[0-9]{1,3} *(, *[0-9]{1,3} *){0,31}$' }
          example: '4,5'
        - name: eligible
          in: query
          description: >-
            `true`: keep only mints with `eligibleForRecommendation: true`, the mints the deprecated `/mints/recommend`
            returns. `false`: keep only the others. Absent: no filter. Added 2026-10-20.
          schema: { type: boolean }
        - name: method
          in: query
          description: >-
            Keep mints that advertise this payment method in NUT-04 (mint) or NUT-05 (melt), on any unit; with `unit`
            also given, on that unit. A mint with `methods: null` never matches. Added 2026-10-20.
          schema: { type: string, enum: [bolt11, bolt12, onchain] }
        - name: maxInputFeePpk
          in: query
          description: >-
            Keep mints whose active keysets for `unit` (every unit when `unit` is not given) all have
            `inputFeePpk <= maxInputFeePpk`. A mint with an unknown fee, or without an active keyset in scope, is excluded.
            Added 2026-10-20.
          schema: { type: integer, minimum: 0, maximum: 1000000 }
          example: 0
        - name: include
          in: query
          description: >-
            Comma-separated list of `facts`, `keysets`, `methods`, `breakdown`, `changes`: add the heavier fields of that name to every object
            (`facts` brings `pubkey`, `firstSeenAt`, `lastOnlineAt`, `sample`, `contactChecks`, `feeExamples`, `limits` and `auditByDirection`; `keysets` brings `keysets` and `keysetsCheckedAt`; `methods` brings
            `methods`; `breakdown` brings `scoreBreakdown`; `changes` brings the newest 10 `changes` of each mint and `changesPending`).
            An unknown value is a `400`. Added 2026-10-20.
          schema: { type: string, pattern: '^(facts|keysets|methods|breakdown|changes)(,(facts|keysets|methods|breakdown|changes))*$' }
          example: 'facts,keysets,methods,breakdown,changes'
        - name: changedSince
          in: query
          description: >-
            Keep mints with at least one confirmed change (see `changes`) observed after this time. Accepted: an ISO 8601 time with
            `Z` or an offset (encode a `+` as `%2B`), a bare date (00:00 UTC) or UNIX seconds (9 to 11 digits); anything else is a `400`.
            `total` and `truncated` count the matches. The JSON API writes times as ISO 8601, the Nostr tags use UNIX seconds.
            Added 2026-10-20.
          schema: { type: string }
          example: '2026-10-20T12:00:00Z'
        - name: limit
          in: query
          description: Maximum number of mints. A value outside 1 to 200 is a `400`.
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The list.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            ETag: { $ref: '#/components/headers/ETag' }
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AllowOrigin' }
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintList' }
              examples:
                lnpay-like:
                  summary: One online mint
                  value:
                    methodology: 4
                    generatedAt: '2026-10-12T18:30:12.345Z'
                    count: 1
                    total: 1
                    truncated: false
                    mints:
                      - url: https://mint.example.com
                        name: Example Mint
                        status: online
                        score: 92
                        scoreStale: false
                        scoreCappedNew: false
                        uptime24hPct: 100
                        uptime7dPct: 99
                        lastCheckedAt: '2026-10-12T18:29:41.000Z'
                        units: [sat]
                        nuts: ['4', '5', '7', '8', '9', '10', '11', '12']
                        software: Nutshell/0.21.0
                        outdated: false
                        isTest: false
                        audit: { swaps7d: 104, attributedFailures: 0, fetchedAt: '2026-10-12T17:40:00.000Z' }
                        reviews: { count: 12, ratedCount: 10, avg: 4.6, operatorCount: 1 }
                        eligibleForRecommendation: true
                        downSince: null
                        hasOnion: false
                        authRequired: { clear: false, blind: false }
                        auditNeutralReason: null
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /wallets/mints/{url}:
    get:
      operationId: getMint
      tags: [Mints]
      summary: One mint
      description: |
        `url` is the mint URL, percent-encoded. It is normalised exactly like stored mint URLs (https, lower-case
        host, no trailing slash; `http://` becomes `https://`) and checked for a well-formed public https URL without
        any DNS lookup or outbound request. Any other scheme (`ftp://`, `javascript:`, `data:`, …) is `400 invalid_url`. A test, archived or offline mint is returned when asked for by URL; `status` and `isTest` tell
        them apart. If no mint has exactly this URL but exactly one differs from it only in the letter case of the path,
        that mint is returned and `canonicalUrl` holds its stored URL; with several candidates, or none, the answer is `404`.
        The mint object carries every field here, including `keysets`, `keysetsCheckedAt`, `methods`, `scoreBreakdown`, `changes` and `changesPending`.
      parameters:
        - name: url
          in: path
          required: true
          description: The percent-encoded mint URL.
          schema: { type: string, maxLength: 1500 }
          example: https%3A%2F%2Fmint.example.com
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The mint.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            ETag: { $ref: '#/components/headers/ETag' }
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AllowOrigin' }
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintResponse' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          description: The path is not valid percent-encoding, has a scheme other than http or https, or is not a well-formed public https URL (`invalid_url`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_url, message: The path must be a percent-encoded https:// mint URL } }
        '404':
          description: No tracked mint has this URL (`mint_not_found`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: mint_not_found, message: No tracked mint has this URL } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The `ETag` of an earlier answer. A match gives `304` with the same headers and no body.
      schema: { type: string }
  headers:
    CacheControl:
      description: Always `public, max-age=300`.
      schema: { type: string, const: 'public, max-age=300' }
    ETag:
      description: ETag over the body. Strong on an uncompressed answer; the weak form `W/"..."` of the same value when the answer is compressed. Send it back unchanged.
      schema: { type: string }
    AllowOrigin:
      description: Always `*` (no credentials).
      schema: { type: string, const: '*' }
    RateLimitLimit:
      description: Requests allowed per minute and IP (300).
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix time in seconds when the current window ends.
      schema: { type: integer }
    RetryAfter:
      description: Seconds until the window frees up.
      schema: { type: integer, minimum: 1 }
  responses:
    NotModified:
      description: Not modified. Same `Cache-Control` and `ETag`, no body.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
        ETag: { $ref: '#/components/headers/ETag' }
        Access-Control-Allow-Origin: { $ref: '#/components/headers/AllowOrigin' }
    BadRequest:
      description: A query value is present but invalid (`invalid_parameter`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid_parameter, message: minScore must be an integer from 0 to 100 } }
    TooManyRequests:
      description: Over 300 requests per minute for this IP (`rate_limited`).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        Access-Control-Allow-Origin: { $ref: '#/components/headers/AllowOrigin' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: rate_limited, message: Too many requests. See Retry-After., retryAfterSec: 23 } }
    InternalError:
      description: Server error (`internal_error`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: internal_error, message: Internal server error } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable snake_case identifier.
              enum: [invalid_parameter, invalid_url, mint_not_found, not_found, rate_limited, internal_error]
            message:
              type: string
              description: Human-readable text; not stable, do not parse it.
            retryAfterSec:
              type: integer
              minimum: 1
              description: Only on `rate_limited`; equals the `Retry-After` header.
    MintList:
      type: object
      required: [methodology, generatedAt, count, total, truncated, mints]
      properties:
        methodology: { $ref: '#/components/schemas/Methodology' }
        generatedAt: { $ref: '#/components/schemas/GeneratedAt' }
        count:
          type: integer
          minimum: 0
          description: Length of `mints`.
        total:
          type: integer
          minimum: 0
          description: How many mints match the filters before `limit` is applied. Added 2026-10-20.
        truncated:
          type: boolean
          description: True when `total` is greater than `count`, that is `limit` cut the list. Added 2026-10-20.
        mints:
          type: array
          items: { $ref: '#/components/schemas/Mint' }
    MintResponse:
      type: object
      required: [methodology, generatedAt, mint, canonicalUrl]
      properties:
        methodology: { $ref: '#/components/schemas/Methodology' }
        generatedAt: { $ref: '#/components/schemas/GeneratedAt' }
        mint: { $ref: '#/components/schemas/Mint' }
        canonicalUrl:
          type: [string, 'null']
          description: Null when the URL you asked for is the stored one. Otherwise the stored URL (the request differed from it only in the letter case of the path and exactly one mint matched). Added 2026-10-20.
    Methodology:
      type: integer
      minimum: 1
      description: Version of the Reliability Score formula. Changes whenever the formula changes; scores of different versions are not comparable.
      examples: [3]
    GeneratedAt:
      type: string
      format: date-time
      description: When the snapshot behind the answer was read from the database (at most 60 seconds old; identical for every caller of one snapshot).
    Mint:
      type: object
      description: |
        Operational health of one mint. Never contains IP addresses, ASNs, hosting organisations, server locations,
        error messages, reviewer public keys, review texts or contact details (`contactChecks` states only whether MintRadar recognises the format of the entries, never a value or a domain). It does carry the mint's public NUT-06
        key (`pubkey`) and whether it advertises a Tor address (`hasOnion`). The fields from `pubkey` on were added on
        2026-10-20; `pubkey`, `firstSeenAt`, `lastOnlineAt`, `sample`, `keysets`, `keysetsCheckedAt`, `methods`,
        `scoreBreakdown`, `changes`, `changesPending`, `contactChecks`, `feeExamples`, `limits` and `auditByDirection` are only present on the single-mint endpoint and in the list with the matching `include` value.
      required:
        - url
        - name
        - status
        - score
        - scoreStale
        - scoreCappedNew
        - uptime24hPct
        - uptime7dPct
        - lastCheckedAt
        - units
        - nuts
        - software
        - outdated
        - isTest
        - audit
        - reviews
        - eligibleForRecommendation
        - downSince
        - hasOnion
        - authRequired
        - auditNeutralReason
      properties:
        url:
          type: string
          description: Normalised mint URL (https, lower-case host, no trailing slash after a bare host; a path is kept as it is).
        name:
          type: [string, 'null']
          description: The cleaned display name the website uses; null means show the hostname (also for mints on the hidden-names list). Untrusted text, render as plain text.
        status:
          type: string
          enum: [online, offline, degraded, archived]
          description: |
            `online`: the latest probe succeeded. `offline`: the latest probe failed or the mint was never probed.
            `degraded`: the latest probe failed and either the mint has at least 4 probes in the last 24 hours
            and none of them succeeded, or that failed probe is more than 24 hours old. `archived`: the latest
            probe failed and the last successful probe was more than 30 days ago (checked first; a mint that
            never had a successful probe is not archived).
        score:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: The stored Reliability Score (operational health; not solvency). Null until the first probe.
        scoreStale:
          type: boolean
          description: >-
            True when `status` is not `online` (offline, degraded or archived), false when it is online. The score of a mint
            that is not online is the last measured one: the mint is not reachable now, so it says nothing about the present.
            Derived from `status` only; the score value is not changed. Always present, also in the default list (added 2026-10-21).
        scoreCappedNew:
          type: boolean
          description: True while the mint is younger than 30 days; its score is capped at 75.
        uptime24hPct:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        uptime7dPct:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
        units:
          type: [array, 'null']
          items: { type: string }
          description: 'Units the mint lists (sat, usd, eur, ...); null when unknown. `units` and the `unit=` filter list the units for which the mint declares a payment method (NUT-04/05); units that appear only in keysets (`include=keysets`) are not included, so a mint with no declared methods has `units: null`.'
        nuts:
          type: [array, 'null']
          items: { type: string }
          description: NUT numbers the mint advertises, ascending, as strings. A NUT whose `/v1/info` entry has `supported: false` is not counted as supported and is not listed (since methodology 4, 2026-10-21); null when unknown.
        software:
          type: [string, 'null']
          maxLength: 100
          description: The mint's own version string (for example `Nutshell/0.21.0`). Untrusted text.
        outdated:
          type: [boolean, 'null']
          description: |
            True when two or more minor versions behind the newest stable release of that software family.
            Null for unknown software, a missing or unreadable version, or no reference release.
        isTest:
          type: boolean
          description: On MintRadar's manual test-mint list. Test mints are never recommended.
        audit:
          oneOf:
            - $ref: '#/components/schemas/Audit'
            - type: 'null'
        reviews: { $ref: '#/components/schemas/Reviews' }
        eligibleForRecommendation:
          type: boolean
          description: True when the mint is online, has a score, is not a test mint and was first seen at least 14 days ago.
        pubkey:
          type: [string, 'null']
          description: Only with `include=facts` (always on the single-mint endpoint). The mint's public NUT-06 key as MintRadar last stored it (66 hex characters); null when none is stored. Public data the mint publishes itself.
        firstSeenAt:
          type: [string, 'null']
          format: date-time
          description: Only with `include=facts` (always on the single-mint endpoint). When MintRadar first saw the mint (the date eligibleForRecommendation counts from).
        lastOnlineAt:
          type: [string, 'null']
          format: date-time
          description: Only with `include=facts` (always on the single-mint endpoint). Time of the latest successful probe; null when the mint never answered.
        contactChecks:
          type: array
          items: { $ref: '#/components/schemas/ContactCheck' }
          description: >-
            Only with `include=facts` (always on the single-mint endpoint). Facts about the contact entries the mint lists, one object per
            entry (at most 10 entries, at most 3 of kind email); an empty array when nothing was checked. No value and no domain is returned
            or stored, and no request is made to a contact value. Facts with a time, not a judgement; not part of the score. Added 2026-10-20.
        feeExamples:
          type: array
          items: { $ref: '#/components/schemas/FeeExampleUnit' }
          description: >-
            Only with `include=facts` (always on the single-mint endpoint). The input fee in plain amounts for each unit that has an
            active keyset (a keyset that states no input_fee_ppk, or an unusable value, counts as 0, the NUT-02 default; keysets[].inputFeePpk stays null for both): the fee for spending 1, 16 and 100 proofs, computed as in NUT-02 (sum of the proofs'
            input_fee_ppk divided by 1000, rounded up) from the stored keysets, not from a request to the mint. An empty array when
            no keyset check has stored an active keyset yet. Added 2026-10-21.
        limits:
          description: >-
            Only with `include=facts` (always on the single-mint endpoint). The limits the mint declares in its /v1/info for NUT-04
            (mint) and NUT-05 (melt). Lightning fee reserves are not here (they depend on the invoice and are only known when a quote
            is requested). Null when neither is stored. Added 2026-10-21.
          oneOf:
            - $ref: '#/components/schemas/Limits'
            - type: 'null'
        auditByDirection:
          description: >-
            Only with `include=facts` (always on the single-mint endpoint). cashu.info's swaps of the last 7 days split by direction,
            the same stored data the audit part of the score counts in total (the score uses the combined number). Added 2026-10-21.
          allOf:
            - $ref: '#/components/schemas/AuditByDirection'
        downSince:
          type: [string, 'null']
          format: date-time
          description: 'Start of the current offline streak: the first failed probe after `lastOnlineAt` (the first failed probe kept in the 90-day history for a mint that never answered). Null while `status` is `online`.'
        hasOnion:
          type: boolean
          description: True when the mint advertises a Tor (.onion) address; false when it does not or when that is not known.
        authRequired:
          oneOf:
            - $ref: '#/components/schemas/AuthRequired'
            - type: 'null'
        sample:
          description: Only with `include=facts` (always on the single-mint endpoint).
          allOf:
            - $ref: '#/components/schemas/Sample'
        auditNeutralReason:
          type: [string, 'null']
          enum: [low_sample, stale, no_data, null]
          description: >-
            Why the audit part of the score is the neutral value 12.5: `low_sample` (fewer swaps than the minimum),
            `stale` (the stored detail is older than the maximum age), `no_data` (nothing stored). Null while the audit part is
            measured. Same rules and thresholds as the score, read when the response is built.
        keysets:
          type: array
          items: { $ref: '#/components/schemas/Keyset' }
          description: Only with `include=keysets` (always on the single-mint endpoint). The keysets the latest successful check found, ordered by id. An empty array when the mint was never checked.
        keysetsCheckedAt:
          type: [string, 'null']
          format: date-time
          description: Only with `include=keysets`. Time of the latest successful keysets check; null when there was none.
        methods:
          oneOf:
            - $ref: '#/components/schemas/Methods'
            - type: 'null'
        scoreBreakdown:
          oneOf:
            - $ref: '#/components/schemas/ScoreBreakdown'
            - type: 'null'
        changes:
          type: array
          items: { $ref: '#/components/schemas/Change' }
          description: >-
            Only with `include=changes` (the newest 10 per mint; always on the single-mint endpoint, the newest 50). Confirmed changes in the
            mint's public data, newest first; an empty array when there are none. A difference is recorded only after two consecutive
            successful observations. Facts with a source and a time, not a verdict. Added 2026-10-20.
        changesPending:
          oneOf:
            - $ref: '#/components/schemas/ChangesPending'
            - type: 'null'
          description: >-
            Only with `include=changes` (always on the single-mint endpoint). Differences seen once that wait for their confirming
            observation (the next successful probe of /v1/info or keysets check); null when nothing is pending. Never part of
            `changes`, never counted by `changedSince`, never announced; a pending difference may never become a change. Added 2026-10-25.
    ContactCheck:
      type: object
      required: [kind, formatValid, domainResolves, checkedAt]
      properties:
        kind: { type: string, enum: [email, nostr, twitter, x, telegram, signal, url, other], description: 'The kind the mint states; its "website" entry is url, an unlisted kind is other.' }
        formatValid: { type: boolean, description: 'true: MintRadar recognises the format of the value for its kind: e-mail syntax; for nostr (after trimming and removing an optional nostr: prefix) npub or nprofile with a valid bech32 checksum and a 32-byte public key, 64 hex characters, or a NIP-05 style name@domain; https URL with a public host name; for every other kind printable text of a sane length. false means "format not recognised by MintRadar", not that the contact is wrong, fake or unusable.' }
        domainResolves:
          type: [boolean, 'null']
          description: >-
            E-mail entries and NIP-05 style nostr entries (name@domain) only. true: DNS has MX (else A/AAAA) records for the domain; false: DNS says it has none;
            null: not applicable (another kind, an IP literal, localhost, a private or reserved name) or the lookup failed or timed out. null means unknown, never false.
            domainResolves is null when the DNS check could not be completed at the last check (for example a timeout) or does not apply to the contact; it is checked again on the next contact check, about every 24 hours. If a later check cannot be completed, an earlier true is kept for up to 48 hours after that answer (checkedAt is then the time of that answer); a real false always replaces it. NXDOMAIN and a domain with no mail records (no MX and no A/AAAA records, or a null MX) give false.
            Only DNS is asked: /.well-known/nostr.json is never requested, so true says nothing about whether a NIP-05 name exists.
        checkedAt: { type: string, format: date-time, description: When the entry was checked (a mint is re-checked at most once every 24 hours). }
    FeeExampleUnit:
      type: object
      required: [unit, inputFeePpk, examples]
      properties:
        unit: { type: string }
        inputFeePpk: { type: integer, minimum: 0, description: The largest input_fee_ppk among the active keysets of this unit. }
        examples:
          type: array
          description: Spending 1, 16 and 100 proofs.
          items:
            type: object
            required: [proofs, fee]
            properties:
              proofs: { type: integer, enum: [1, 16, 100] }
              fee: { type: integer, minimum: 0, description: 'ceil(inputFeePpk * proofs / 1000), in the unit.' }
    Limits:
      type: object
      required: [mint, melt]
      properties:
        mint: { type: array, items: { $ref: '#/components/schemas/Limit' }, description: NUT-04 entries. }
        melt: { type: array, items: { $ref: '#/components/schemas/Limit' }, description: NUT-05 entries. }
    Limit:
      type: object
      required: [method, unit, min, max]
      properties:
        method: { type: string }
        unit: { type: string }
        min: { type: [integer, 'null'], minimum: 0, description: Null when the mint does not declare a minimum. }
        max: { type: [integer, 'null'], minimum: 0, description: Null when the mint does not declare a maximum. }
    AuditByDirection:
      type: object
      required: [mint, melt]
      properties:
        mint:
          description: Swaps in which this mint was the destination (a Lightning deposit, NUT-04). Null when no numbers are stored.
          oneOf:
            - $ref: '#/components/schemas/AuditDirection'
            - type: 'null'
        melt:
          description: Swaps in which this mint was the source (a Lightning withdrawal, NUT-05). Null when no numbers are stored.
          oneOf:
            - $ref: '#/components/schemas/AuditDirection'
            - type: 'null'
    AuditDirection:
      type: object
      required: [attempts, failures, windowDays, source, syncedAt]
      properties:
        attempts: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0, description: Every failed swap of this direction, including the ones cashu.info does not blame on the mint; never more than attempts. }
        windowDays: { type: integer, enum: [7] }
        source: { type: string, enum: [cashu.info] }
        syncedAt: { type: string, format: date-time, description: When MintRadar stored the data. }
    Change:
      type: object
      required: [type, field, oldValue, newValue, observedAt, firstSeenAt]
      properties:
        type:
          type: string
          enum: [pubkey_changed, input_fee_changed, keyset_added, keyset_removed, keyset_deactivated, keyset_reactivated, keyset_final_expiry_changed, motd_changed, name_changed, description_changed, contact_changed, version_changed, nuts_changed, methods_changed]
        field: { type: string, description: 'Short name of what changed: pubkey, motd, name, description, description_long, contact, version, nuts, methods, keyset or input_fee.' }
        oldValue: { type: [string, 'null'], maxLength: 200, description: 'Plain text; URLs are replaced by [link], contacts are method kinds and a count only. Null when there is no old side (a keyset added).' }
        newValue: { type: [string, 'null'], maxLength: 200, description: 'Same rules as oldValue. "multiple changes" for the summary row of a day with more than 20 changes of one mint and type.' }
        observedAt: { type: string, format: date-time, description: When the change was confirmed by the second consecutive observation. }
        firstSeenAt: { type: string, format: date-time, description: When the new value was first seen, before it was confirmed. }
    ChangesPending:
      type: object
      required: [firstSeenAt, diff]
      properties:
        firstSeenAt: { type: string, format: date-time, description: The earliest firstSeenAt of the diff items. }
        diff:
          type: array
          items: { $ref: '#/components/schemas/PendingChange' }
          description: What would be recorded if the next observation confirms it, in the text form of `changes`.
    PendingChange:
      type: object
      required: [type, field, oldValue, newValue, firstSeenAt]
      properties:
        type: { type: string, description: 'One of the Change types.' }
        field: { type: string, description: 'Same as Change.field.' }
        oldValue: { type: [string, 'null'], maxLength: 200, description: 'Same rules as Change.oldValue.' }
        newValue: { type: [string, 'null'], maxLength: 200, description: 'Same rules as Change.newValue.' }
        firstSeenAt: { type: string, format: date-time, description: When the new value was first seen. }
    AuthRequired:
      type: object
      description: >-
        What the mint ADVERTISES about authentication, not what is enforced: MintRadar does not parse
        `protected_endpoints`, so `true` does not say which endpoints (mint, melt, swap, ...) need a token.
      required: [clear, blind]
      properties:
        clear: { type: boolean, description: The mint lists NUT-21 (clear auth) and does not mark it `supported: false`. }
        blind: { type: boolean, description: The mint lists NUT-22 (blind auth) and does not mark it `supported: false`. }
    Sample:
      type: object
      description: How much data the numbers rest on.
      required: [probes24h, swaps7d]
      properties:
        probes24h: { type: [integer, 'null'], minimum: 0, description: Probes recorded in the last 24 hours. }
        swaps7d: { type: [integer, 'null'], minimum: 0, description: Swaps in the stored cashu.info 7-day window (the number the audit part of the score uses); null when no detail is stored. }
    Keyset:
      type: object
      required: [id, unit, active, inputFeePpk, finalExpiry, idVersion, idValid]
      properties:
        id: { type: string }
        unit: { type: string }
        active: { type: boolean }
        inputFeePpk: { type: [integer, 'null'], minimum: 0, description: Input fee in parts per thousand of a unit; null when the mint did not state a valid fee. }
        finalExpiry: { type: [string, 'null'], format: date-time }
        idVersion: { type: string, description: '`v1`, `v2` or `legacy`.' }
        idValid: { type: [boolean, 'null'], description: True or false after MintRadar compared the id with the keys; null when it could not be verified. }
    Methods:
      type: object
      description: The payment methods the mint advertises in NUT-04 (mint) and NUT-05 (melt); null when neither is stored.
      required: [mint, melt]
      properties:
        mint: { type: array, items: { $ref: '#/components/schemas/MethodEntry' } }
        melt: { type: array, items: { $ref: '#/components/schemas/MethodEntry' } }
    MethodEntry:
      type: object
      required: [method, unit, minAmount, maxAmount]
      properties:
        method: { type: string, description: 'For example `bolt11`, `bolt12` or `onchain`.' }
        unit: { type: string }
        minAmount: { type: [integer, 'null'] }
        maxAmount: { type: [integer, 'null'] }
    ScoreBreakdown:
      type: object
      description: >-
        What the score used at its last computation, written in the same step as the score. Neutral audit data counts
        12.5 points, so the five parts can end in .5: `sum` is the parts added, rounded once, plus `newMintCap.points`.
        Null until the first probe after this field was introduced.
      required: [uptime, audit, nuts, version, contact, newMintCap, sum]
      properties:
        uptime: { $ref: '#/components/schemas/ScorePart' }
        audit: { $ref: '#/components/schemas/ScorePart' }
        nuts: { $ref: '#/components/schemas/ScorePart' }
        version: { $ref: '#/components/schemas/ScorePart' }
        contact: { $ref: '#/components/schemas/ScorePart' }
        newMintCap:
          type: object
          description: The correction (0 or negative) the cap for mints younger than 30 days made, and the cap.
          required: [points, cap]
          properties:
            points: { type: integer, maximum: 0 }
            cap: { type: integer }
        sum: { type: integer, minimum: 0, maximum: 100, description: Equal to `score` as it was stored with this breakdown. }
    ScorePart:
      type: object
      required: [points, max]
      properties:
        points: { type: number, minimum: 0 }
        max: { type: integer, description: 'uptime 40, audit 25, nuts 15, version 15, contact 5.' }
    Audit:
      type: object
      description: The 7-day swap window published by cashu.info. Fewer than 10 swaps, or data older than 168 hours, scores neutral in the Reliability Score.
      required: [swaps7d, attributedFailures, fetchedAt]
      properties:
        swaps7d: { type: integer, minimum: 0, description: All swaps in the window. }
        attributedFailures: { type: integer, minimum: 0, description: Failures cashu.info attributes to this mint. }
        fetchedAt: { type: string, format: date-time }
    Reviews:
      type: object
      description: Community Rating, the same definitions as the MintRadar website. Reviews from a key that is both listed as the mint's Nostr contact and the author of its NIP-87 announcement are left out of `count`, `ratedCount` and `avg`.
      required: [count, ratedCount, avg, operatorCount]
      properties:
        count: { type: integer, minimum: 0, description: Counted NIP-87 reviews. }
        ratedCount: { type: integer, minimum: 0, description: How many of them carry a rating (the n behind `avg`). }
        avg:
          type: [number, 'null']
          description: Average rating over the rated reviews (one decimal); null when none.
        operatorCount: { type: integer, minimum: 0, description: Reviews from a key that is both listed as the mint's Nostr contact and the author of its NIP-87 announcement. }
