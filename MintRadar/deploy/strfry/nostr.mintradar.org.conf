# wss://nostr.mintradar.org — strfry backup relay for MintRadar's own Nostr
# events (mint announcements, reviews). Additive: does not replace or modify
# any existing vhost. strfry itself listens on 127.0.0.1:7777 (see
# deploy/strfry/docker-compose.strfry.yml) and is only reachable through this
# proxy.
#
# Standard nginx websocket-proxy idiom: only force "Connection: upgrade" for
# requests that actually asked to upgrade (the websocket handshake); plain
# HTTP GETs — e.g. NIP-11 relay-info requests with an
# `Accept: application/nostr+json` header, which strfry answers on the same
# port — must not have "Connection: upgrade" forced on them.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP cap on concurrent connections. Websocket connections here are kept
# open up to proxy_read_timeout (3600s) below, and strfry itself has no
# built-in connection-flood protection — without this, one IP could open
# unbounded concurrent connections against a publicly reachable service.
# 20 is generous enough for a legitimate multi-tab/multi-device client.
limit_conn_zone $binary_remote_addr zone=strfry_conn:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl; # managed by Certbot
    server_name nostr.mintradar.org;

    ssl_certificate /etc/letsencrypt/live/nostr.mintradar.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nostr.mintradar.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Same anti-scanner block as the other vhosts on this box — cheap
    # defense-in-depth even though this service has no CMS/admin surface.
    location ~* (?:^|/)(?:wp-admin|wp-login\.php|wp-json|xmlrpc\.php|\.env|\.git|\.aws)(?:/|\.|$) {
        return 444;
    }

    location / {
        limit_conn strfry_conn 20;
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived websocket connections — default 60s proxy_read_timeout
        # would silently drop idle-but-open subscriptions.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name nostr.mintradar.org;
    return 301 https://$host$request_uri;
}
