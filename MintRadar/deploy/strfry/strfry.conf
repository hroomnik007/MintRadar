##
## strfry config — MintRadar backup relay (wss://nostr.mintradar.org)
##
## Additive, whitelist-only relay: durable backup store for MintRadar's own
## Nostr events (mint announcements + reviews). Not a general-purpose relay.
## Write policy enforced by ./plugins/writePolicy.sh, not by this file.
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256

    # Conservative virtual-mapping cap (1 GiB) instead of strfry's 10TB default.
    # This box has no swap configured — even though LMDB's mmap is lazily
    # populated and doesn't itself consume RAM/disk until pages are written,
    # a small explicit cap keeps this bounded rather than relying on that
    # assumption, and is enormous headroom for a whitelist-only, 2-kind,
    # single-privileged-pubkey write volume.
    mapsize = 1073741824

    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    # Bind all interfaces *inside the container's own network namespace* —
    # Docker's port publishing (127.0.0.1:7777:7777 in docker-compose.yml)
    # is what actually restricts external reachability to nginx on the host;
    # binding 127.0.0.1 here would make the relay unreachable via Docker's
    # bridge/NAT from the reverse proxy.
    bind = "0.0.0.0"
    port = 7777

    nofiles = 524288

    # Set by the nginx reverse proxy (proxy_set_header X-Real-IP $remote_addr)
    # so strfry logs/limits see the real client IP, not the docker-proxy hop.
    realIpHeader = "x-real-ip"

    auth {
        enabled = true
        serviceUrl = "wss://nostr.mintradar.org"
        restrictedReadKinds = "4, 1059"
        restrictReadToInvolvedPubkey = true
    }

    info {
        name = "MintRadar Relay"
        description = "Private backup relay for the MintRadar project. Not open to the public — writes are restricted to a whitelist."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        # NIP-01 (base protocol), NIP-09 (event deletion), NIP-11 (this doc),
        # NIP-42 (AUTH) — confirmed against strfry 1.1.3's supported-NIP list.
        # Deliberately not advertising strfry's other supported NIPs (2, 4,
        # 28, 40, 45, 70, 77): they're not meaningfully "supported" for this
        # relay's actual restricted-write use case.
        nips = "[1, 9, 11, 42]"
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 200
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxTagsPerFilter = 3
    maxFilterLimitCount = 1000000
    maxSubsPerConnection = 200
    maxPendingOutboundBytes = 33554432

    writePolicy {
        plugin = "./plugins/writePolicy.sh"
        timeoutSeconds = 10
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    # Trimmed from strfry's defaults (3/3/3/2 = 11 threads) — this is a 2-core
    # box shared with the dashboard backend + 3 Postgres containers, and the
    # expected traffic (whitelist-only writes, small read volume) doesn't need
    # strfry's default thread counts, which were sized for much busier relays.
    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }

    filterValidation {
        enabled = false
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 3
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
