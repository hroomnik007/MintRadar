# --- OG tags MVP for /mint/:url (bot-only, see backend/src/og.ts) ---------
# Social crawlers don't run JS, so they never see the SPA's client-rendered
# meta tags. These two maps detect a crawler UA and, for /mint/ requests,
# extract the encodeURIComponent()-encoded mint URL segment straight from the
# raw, not-yet-decoded request line — deliberately sourced from $request_uri
# (never $uri) so the %2F/%3A escapes inside the mint URL survive untouched
# and reach Express's own query-string decoder exactly once, instead of
# nginx's internal URI normalization silently decoding them first.
map $http_user_agent $is_social_bot {
    default 0;
    ~*Twitterbot 1;
    ~*Discordbot 1;
    ~*TelegramBot 1;
    ~*facebookexternalhit 1;
    ~*Slackbot 1;
    ~*WhatsApp 1;
}

map $request_uri $mint_og_lookup_url {
    # Stop at ? # and & too, so a crafted /mint/<x>&admin=1 can't smuggle a
    # second query param into the internal /api/og/mint?url=... request
    # (harmless today — the handler reads only `url` — but tighter is better).
    ~^/mint/(?<mint_encoded>[^/?&#]+) $mint_encoded;
    default "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    server_name mintradar.org www.mintradar.org;

    ssl_certificate /etc/letsencrypt/live/mintradar.pedani.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mintradar.pedani.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # -- Block common vulnerability-scanner probes -----------------------------
    # Silently drop the connection (444) for CMS/secret/webshell scan paths.
    # Keeps them off the backend and out of the error log. Complements the
    # fail2ban nginx-scanners jail.
    location ~* (?:^|/)(?:wp-admin|wp-login\.php|wp-json|xmlrpc\.php|\.env|\.git|\.aws)(?:/|\.|$) {
        return 444;
    }

    # Some clients hard-guess /favicon.png (we ship favicon.ico/.svg); answer
    # 204 instead of letting it fall through to a logged 404.
    location = /favicon.png {
        return 204;
        access_log off;
    }

    root /var/www/mintradar/dist;
    index index.html;

    # Web manifest MIME type. The distro mime.types has no webmanifest entry, so the manifest was served as
    # application/octet-stream. A types {} block in a server REPLACES the inherited map, so the full default
    # list is re-included first and the extra mapping is added after it (two types blocks in one context add
    # up). If a future mime.types already maps webmanifest, nginx only warns about the duplicate; remove this
    # block then.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Backend API proxy → Express on 127.0.0.1:3002
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app sets these three itself with the same values (backend/src/index.ts); nginx adds them at server
        # level, so without this each would be sent twice. Only these three: the app's own CSP on /api/mint/icon
        # is stricter than the server one and must keep reaching the client.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app sets these three itself with the same values (backend/src/index.ts); nginx adds them at server
        # level, so without this each would be sent twice. Only these three: the app's own CSP on /api/mint/icon
        # is stricter than the server one and must keep reaching the client.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Dynamically generated from the mints table (backend GET /sitemap.xml) so every
    # tracked mint's /mint/:url page is included — a static file can't reflect the
    # mint list as it changes.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app sets these three itself with the same values (backend/src/index.ts); nginx adds them at server
        # level, so without this each would be sent twice. Only these three: the app's own CSP on /api/mint/icon
        # is stricter than the server one and must keep reaching the client.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # /mint/:url — social crawlers get the bot-only OG fragment from the
    # backend (GET /api/og/mint?url=...); everyone else gets the normal SPA.
    # `if` here is limited to `rewrite ... last`, one of the documented safe
    # uses of `if` inside a location block (see nginx "if is evil" wiki).
    location /mint/ {
        if ($is_social_bot) {
            rewrite ^ /api/og/mint?url=$mint_og_lookup_url last;
        }
        try_files $uri $uri/ /index.html;
    }

    # NIP-05 identity verification (Nostr). Static file, but needs CORS since
    # Nostr clients fetch it cross-origin from the browser when verifying a
    # profile's nip05 field.
    location = /.well-known/nostr.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=3600";
        # Repeated here: this location's own add_header drops the server-level security headers.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # security.txt (RFC 9116) must be text/plain with charset=utf-8; mime.types alone sends no charset.
    # Exact match, so it wins over `location /` and every regex location. No add_header here on
    # purpose: any add_header would drop the server-level security headers (non-inheritance), whereas
    # `expires` sets Cache-Control without affecting inheritance, so all security headers still apply.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        expires 1h;
        try_files $uri =404;
    }

    # PWA — all routes to index.html (React Router). Unknown paths deliberately keep returning the app
    # shell with status 200; the in-app catch-all route (src/pages/NotFound.tsx) renders "Page not found".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively.
    # Nginx does not inherit parent-level add_header directives when a location defines
    # its own, so all security headers are repeated in every location that adds headers.
    location ~* \.(js|css|png|svg|ico|woff2|webmanifest)$ {
        # One Cache-Control header (expires 1y plus add_header used to send two).
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # Service worker and PWA registration files — never cache so updates reach clients immediately.
    # registerSW.js contains the controllerchange reload listener; if cached long-term,
    # browsers run the old stub (no listener) and never detect SW updates.
    # manifest.webmanifest has no content hash, so it must also be served fresh.
    # Headers repeated here due to nginx non-inheritance of parent add_header directives.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }
    location = /registerSW.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }
    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # Security headers — applied to all locations that don't define their own add_header
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name mintradar.org www.mintradar.org;

    if ($host = www.mintradar.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = mintradar.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}
