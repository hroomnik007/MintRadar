# --- OG tags MVP for /mint/:url (bot-only, see backend/src/og.ts) ---------
# Social crawlers don't run JS, so they never see the SPA's client-rendered
# meta tags. These two maps detect a crawler UA and, for /mint/ requests,
# extract the encodeURIComponent()-encoded mint URL segment straight from the
# raw, not-yet-decoded request line — deliberately sourced from $request_uri
# (never $uri) so the %2F/%3A escapes inside the mint URL survive untouched
# and reach Express's own query-string decoder exactly once, instead of
# nginx's internal URI normalization silently decoding them first.
map $http_user_agent $is_social_bot {
    default 0;
    ~*Twitterbot 1;
    ~*Discordbot 1;
    ~*TelegramBot 1;
    ~*facebookexternalhit 1;
    ~*Slackbot 1;
    ~*WhatsApp 1;
}

map $request_uri $mint_og_lookup_url {
    # Stop at ? # and & too, so a crafted /mint/<x>&admin=1 can't smuggle a
    # second query param into the internal /api/og/mint?url=... request
    # (harmless today — the handler reads only `url` — but tighter is better).
    ~^/mint/(?<mint_encoded>[^/?&#]+) $mint_encoded;
    default "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    http2 on;
    server_name mintradar.org;

    ssl_certificate /etc/letsencrypt/live/mintradar.pedani.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mintradar.pedani.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # -- Block common vulnerability-scanner probes -----------------------------
    # Silently drop the connection (444) for CMS/secret/webshell scan paths.
    # Keeps them off the backend and out of the error log. Complements the
    # fail2ban nginx-scanners jail.
    location ~* (?:^|/)(?:wp-admin|wp-login\.php|wp-json|xmlrpc\.php|\.env|\.git|\.aws)(?:/|\.|$) {
        return 444;
    }

    # Some clients hard-guess /favicon.png (we ship favicon.ico/.svg); answer
    # 204 instead of letting it fall through to a logged 404.
    location = /favicon.png {
        return 204;
        access_log off;
    }

    root /var/www/mintradar/dist;
    index index.html;

    # Web manifest MIME type (and, since Task D1b, yaml for the OpenAPI file). The distro mime.types has no webmanifest entry, so the manifest was served as
    # application/octet-stream. A types {} block in a server REPLACES the inherited map, so the full default
    # list is re-included first and the extra mapping is added after it (two types blocks in one context add
    # up). If a future mime.types already maps webmanifest, nginx only warns about the duplicate; remove this
    # block then.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/yaml yaml;
    }

    # Compression for JSON and text (2026-10-13). nginx's default gzip_types is only text/html, so JSON (the API:
    # /api/mints/known is ~160 kB, ~21 kB gzipped), JS, CSS, XML and the manifest were never compressed. Set at server
    # level (the http block is not part of this file). Only text types: no images (the PNG/ICO/WOFF2 assets are
    # already compressed or incompressible). Nothing here reflects a secret together with attacker-controlled input
    # (no cookies, no CSRF tokens), so BREACH-style attacks do not apply. nginx turns a strong ETag of a compressed
    # response into a weak one (W/"..."); a client that sends it back in If-None-Match still gets 304.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        application/manifest+json
        application/yaml
        image/svg+xml
        application/xml+rss;

    # Backend API proxy → Express on 127.0.0.1:3002
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app sets these three itself with the same values (backend/src/index.ts); nginx adds them at server
        # level, so without this each would be sent twice. Only these three: the app's own CSP on /api/mint/icon
        # is stricter than the server one and must keep reaching the client.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /health {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app sets these three itself with the same values (backend/src/index.ts); nginx adds them at server
        # level, so without this each would be sent twice. Only these three: the app's own CSP on /api/mint/icon
        # is stricter than the server one and must keep reaching the client.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Dynamically generated from the mints table (backend GET /sitemap.xml) so every
    # tracked mint's /mint/:url page is included — a static file can't reflect the
    # mint list as it changes.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app sets these three itself with the same values (backend/src/index.ts); nginx adds them at server
        # level, so without this each would be sent twice. Only these three: the app's own CSP on /api/mint/icon
        # is stricter than the server one and must keep reaching the client.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # /mint/:url — social crawlers get the bot-only OG fragment from the
    # backend (GET /api/og/mint?url=...); everyone else gets the normal SPA.
    # `if` here is limited to `rewrite ... last`, one of the documented safe
    # uses of `if` inside a location block (see nginx "if is evil" wiki).
    # ^~ keeps the static-asset regex location below from taking over a mint URL that ends in an asset extension
    # (/mint/https%3A%2F%2Fexample.com%2Ficon.svg); nothing is served as a file from /mint/.
    location ^~ /mint/ {
        if ($is_social_bot) {
            rewrite ^ /api/og/mint?url=$mint_og_lookup_url last;
        }
        try_files $uri $uri/ /index.html;
    }

    # /methodology and /for-wallets — the same crawler map as /mint/ above (Googlebot and bingbot are NOT in it and
    # render the SPA): a social crawler gets the small bot HTML from GET /api/og/page, which carries the page's own
    # title, description, canonical and og:url (backend/src/shared/pageMeta.ts is the single source of the text, the
    # pages use the same constants). The slug is FIXED per location (no variable from the request reaches the
    # rewrite), and the trailing "?" drops the client's query string, so a crafted /methodology?p=x cannot add a
    # second `p`. Exact matches, with and without the trailing slash: nothing else is affected; everyone else gets
    # the SPA exactly as through `location /`. These locations set no add_header, so the server-level security
    # headers apply as before. A new static page that needs a preview: add it to PAGE_META and OG_PAGE_SLUGS and
    # add its two locations here (docs/claude/deploy-and-infra.md).
    location = /methodology {
        if ($is_social_bot) {
            rewrite ^ /api/og/page?p=methodology? last;
        }
        try_files $uri $uri/ /index.html;
    }
    location = /methodology/ {
        if ($is_social_bot) {
            rewrite ^ /api/og/page?p=methodology? last;
        }
        try_files $uri $uri/ /index.html;
    }
    location = /for-wallets {
        if ($is_social_bot) {
            rewrite ^ /api/og/page?p=for-wallets? last;
        }
        try_files $uri $uri/ /index.html;
    }
    location = /for-wallets/ {
        if ($is_social_bot) {
            rewrite ^ /api/og/page?p=for-wallets? last;
        }
        try_files $uri $uri/ /index.html;
    }

    # NIP-05 identity verification (Nostr). Static file, but needs CORS since
    # Nostr clients fetch it cross-origin from the browser when verifying a
    # profile's nip05 field.
    location = /.well-known/nostr.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=3600";
        # Repeated here: this location's own add_header drops the server-level security headers.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # security.txt (RFC 9116) must be text/plain with charset=utf-8; mime.types alone sends no charset.
    # Exact match, so it wins over `location /` and every regex location. No add_header here on
    # purpose: any add_header would drop the server-level security headers (non-inheritance), whereas
    # `expires` sets Cache-Control without affecting inheritance, so all security headers still apply.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        expires 1h;
        try_files $uri =404;
    }

    # The Wallet API description (Task D1b). The file is built from docs/openapi/wallets-v1.yaml (vite-openapi.ts), so
    # it exists only in a build; try_files =404 keeps a missing file a real 404 instead of the app shell. The
    # `yaml` type comes from the types block above (application/yaml). CORS * because it is a public static GET
    # resource that browser tools (Swagger UI, Redoc) fetch cross-origin. The security headers are repeated: an
    # add_header in a location replaces the inherited ones (see /.well-known/nostr.json).
    location = /docs/openapi/wallets-v1.yaml {
        try_files $uri =404;
        expires 5m;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # Nothing exists under /docs/ except the OpenAPI file above (exact match, wins over this prefix block). The dist
    # directory docs/openapi/ exists, so without this block /docs and /docs/openapi answered with a bare nginx 403
    # (directory without index). ^~ keeps the regex static-asset location from taking over. No add_header here, so the
    # server-level security headers still apply to the 404.
    location ^~ /docs/ {
        try_files $uri =404;
    }

    # llms.txt (Task D1b): plain Markdown from public/llms.txt, never the app shell. Same header technique as above.
    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
        expires 1h;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # No AI catalog is published (Task D1b). Lighthouse treats a missing catalog as not applicable but fails on an
    # HTML response, which the app shell fallback would send; do not publish a catalog until the spec is stable.
    location = /.well-known/ai-catalog.json {
        return 404;
    }

    # PWA — all routes to index.html (React Router). Unknown paths deliberately keep returning the app
    # shell with status 200; the in-app catch-all route (src/pages/NotFound.tsx) renders "Page not found".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively.
    # Nginx does not inherit parent-level add_header directives when a location defines
    # its own, so all security headers are repeated in every location that adds headers.
    location ~* \.(js|css|png|svg|ico|woff2|webmanifest)$ {
        # One Cache-Control header (expires 1y plus add_header used to send two).
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # Service worker and PWA registration files — never cache so updates reach clients immediately.
    # registerSW.js contains the controllerchange reload listener; if cached long-term,
    # browsers run the old stub (no listener) and never detect SW updates.
    # manifest.webmanifest has no content hash, so it must also be served fresh.
    # Headers repeated here due to nginx non-inheritance of parent add_header directives.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }
    location = /registerSW.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }
    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    }

    # Security headers — applied to all locations that don't define their own add_header
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name mintradar.org;

    if ($host = mintradar.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}

# -- www.mintradar.org is only a redirect to the apex (Task A2, 2026-10-22) ----
# www used to be served as a second name of the app, so the browser called /api/mints/known with
# Origin https://www.mintradar.org, which the backend's origin allow-list rejects (403 cors_forbidden).
# Decision: www is NOT an allowed origin; every request for it, on every path (/api, /sitemap.xml,
# /robots.txt, /.well-known, ...), gets a 301 to the same path and query on the apex.
# Same certificate files as the apex block (the certificate must list www.mintradar.org; check it before
# applying, see docs/claude/deploy-and-infra.md). The security headers of the apex server level are repeated
# (a redirect has no body, so they are only for parity and for HSTS on the www name).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mintradar.org;

    ssl_certificate /etc/letsencrypt/live/mintradar.pedani.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mintradar.pedani.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    return 301 https://mintradar.org$request_uri;
}

# Port 80 for www: the same single redirect (straight to https on the apex, no intermediate hop through www).
# No ACME location existed on port 80 before either: certbot's nginx authenticator (setup-server.sh uses
# `certbot --nginx`) adds its own challenge handling for the names it renews, as it did for the old shared block.
server {
    listen 80;
    listen [::]:80;
    server_name www.mintradar.org;

    return 301 https://mintradar.org$request_uri;
}
