<!doctype html>
<!-- Source of public/og-image-mintradar.png (1200x630, UI/UX report D6, 2026-11-22): MintRadar Sans + the site's
     colours (copper action, mint accent), the radar mark of favicon.svg. Render: node scripts/render-og-image.mjs -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'MintRadar Sans'; src: url('../../public/fonts/MintRadarSans-2.0.27-latin.woff2') format('woff2'); font-weight: 400 700; }
@font-face { font-family: 'MintRadar Wordmark'; src: url('../../public/fonts/DMSans-wordmark-600.woff2') format('woff2'); font-weight: 600; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; background: #0b1512; }
body { font-family: 'MintRadar Sans', sans-serif; color: #f2f7f4; padding: 48px; }
.panel { position: relative; height: 534px; background: #132019; border: 1px solid rgba(255,255,255,.09); border-radius: 20px; padding: 64px 72px; overflow: hidden; }
.glow { position: absolute; right: -140px; top: -160px; width: 560px; height: 560px; border-radius: 50%;
  background: radial-gradient(circle, rgba(92,201,163,.10), rgba(92,201,163,0) 65%); }
.brand { display: flex; align-items: center; gap: 24px; }
.brand svg { width: 104px; height: 104px; flex: none; }
.word { font-family: 'MintRadar Wordmark', 'MintRadar Sans', sans-serif; font-weight: 600; font-size: 76px; letter-spacing: -0.5px; line-height: 1; }
.word span { color: #5cc9a3; }
h1 { margin-top: 44px; font-size: 50px; font-weight: 650; line-height: 1.12; letter-spacing: -0.5px; max-width: 900px; }
h1 em { font-style: normal; color: #d98a5a; }
.facts { display: flex; gap: 12px; margin-top: 36px; }
.fact { font-size: 24px; font-weight: 500; color: #b7c8c0; padding: 10px 18px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; }
.fact b { color: #d98a5a; font-weight: 700; }
.foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; font-size: 22px; color: #9aada4; }
.foot .url { color: #f2f7f4; font-weight: 600; }
</style></head><body>
<div class="panel">
  <div class="glow"></div>
  <div class="brand">

      <circle cx="16" cy="16" r="13" fill="#0b1512"/>

      <path d="M16 16 L11.9 4.72 A12 12 0 0 1 16 4 Z" fill="#5cc9a3" opacity="0.14"/>

      <circle cx="16" cy="16" r="13" stroke="#5cc9a3" stroke-width="1.7"/>
      <circle cx="16" cy="16" r="6.5" stroke="#5cc9a3" stroke-width="0.8" opacity="0.35"/>
      <path d="M16 16 L26.39 10" stroke="#9ddfc5" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="1.7" fill="#9ddfc5"/>
      <circle cx="10.2" cy="20.6" r="3.6" fill="#d98a5a" opacity="0.25"/>
      <circle cx="10.2" cy="20.6" r="1.9" fill="#d98a5a"/>
    </svg>
    <div class="word">Mint<span>Radar</span></div>
  </div>
  <h1>Find Cashu mints and see<br><em>how well they run</em>.</h1>
  <div class="facts">
    <div class="fact"><b>Reliability Score</b></div>
    <div class="fact">Uptime</div>
    <div class="fact">Latency</div>

    <div class="fact">Reviews</div>
