name: Deploy MintRadar
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            MintRadar/backend/package-lock.json
            MintRadar/package-lock.json
      - name: Run backend tests
        run: cd MintRadar/backend && npm ci && npm test
      - name: Run frontend tests
        run: cd MintRadar && npm ci && npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/mintradar-repo
            git fetch origin main
            git reset --hard origin/main
            cd MintRadar/backend
            npm ci
            npm run build
            cd /var/www/mintradar-repo/MintRadar
            docker compose build --pull backend
            docker compose up -d

      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/mintradar-repo
            git fetch origin main
            git reset --hard origin/main
            cd MintRadar
            npm ci
            npm run build
            sudo rm -rf /var/www/mintradar/dist/assets/*
            sudo cp -r dist/* /var/www/mintradar/dist/
            sudo systemctl reload nginx
