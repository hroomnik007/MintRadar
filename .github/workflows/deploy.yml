name: Deploy MintRadar to Hetzner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'MintRadar/**'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_frontend: ${{ steps.filter.outputs.frontend }}
      changed_backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            frontend:
              - 'MintRadar/src/**'
              - 'MintRadar/public/**'
              - 'MintRadar/index.html'
              - 'MintRadar/vite.config.ts'
              - 'MintRadar/package*.json'
            backend:
              - 'MintRadar/backend/**'

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/mintradar-repo/MintRadar
            git fetch origin main && git reset --hard origin/main
            npm ci
            npm run build
            sudo mkdir -p /var/www/mintradar/dist
            sudo chown -R deploy:deploy /var/www/mintradar/dist
            cp -r dist/* /var/www/mintradar/dist/
            sudo systemctl reload nginx

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/mintradar-repo
            git fetch origin main
            git reset --hard origin/main
            cd MintRadar/backend && npm ci && npm run build && cd ../..
            cd MintRadar && docker compose build --no-cache backend
            docker compose up -d backend
