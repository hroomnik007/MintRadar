name: Deploy MintRadar
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    # Pinned on 2026-10-08: GitHub moves ubuntu-latest to Ubuntu 26 on 2026-10-19; move deliberately.
    runs-on: ubuntu-24.04
    # Typical 90-135 s over the last 10 runs; about 3x the slowest of them.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            MintRadar/backend/package-lock.json
            MintRadar/package-lock.json
      - name: Run backend tests
        run: cd MintRadar/backend && npm ci && npm test
      - name: Run frontend tests
        run: cd MintRadar && npm ci && npm test

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    # Typical 62-72 s, but each SSH step may legitimately run up to its 30 m command_timeout (slow registry); this only
    # catches a hang that command_timeout does not.
    timeout-minutes: 45
    steps:
      - name: Deploy backend via SSH
        timeout-minutes: 35
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/mintradar-repo
            git fetch origin main
            git reset --hard origin/main
            cd MintRadar/backend
            npm ci --ignore-scripts
            npm run build
            cd /var/www/mintradar-repo/MintRadar
            docker compose build --pull backend
            docker compose up -d

      - name: Deploy frontend via SSH
        timeout-minutes: 35
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/mintradar-repo
            git fetch origin main
            git reset --hard origin/main
            cd MintRadar
            npm ci --ignore-scripts
            npm run build
            sudo rm -rf /var/www/mintradar/dist/assets/*
            sudo cp -r dist/. /var/www/mintradar/dist/
            sudo systemctl reload nginx
