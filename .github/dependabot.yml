version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/MintRadar"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7.x is a breaking major (baseUrl removed, stricter globals) and
      # outpaces @typescript-eslint peer ranges — bump it deliberately, not via the group.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/MintRadar/backend"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
