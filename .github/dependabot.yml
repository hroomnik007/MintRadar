version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/MintRadar"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/MintRadar/backend"
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns:
          - "*"
