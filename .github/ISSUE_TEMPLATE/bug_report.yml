name: 🐛 Bug report
description: Report something that is broken or behaving incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        **Do not report security vulnerabilities here** — see [SECURITY.md](https://github.com/hroomnik007/MintRadar/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected page / URL
      description: e.g. a specific Mint Detail page, the dashboard, the Token Inspector
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / UI
        - Backend API
        - Trust Score / probing
        - Nostr login / watchlist
        - NIP-87 discovery
        - Reviews
        - Self-hosting / Docker
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser + version, OS, device. If self-hosting, note that and your setup.
      value: |
        - Browser:
        - OS:
        - Device:
        - Self-hosting: no
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console errors / screenshots
      description: Paste any browser console errors or attach screenshots. No private keys or nsec.
    validations:
      required: false
