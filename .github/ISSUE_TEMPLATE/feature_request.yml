name: 💡 Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a large feature request, consider starting a
        [Discussion](https://github.com/hroomnik007/MintRadar/discussions) so the
        idea can be talked through first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or the gap you're running into. "As a user I want… so that…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like MintRadar to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Privacy constraints
      description: MintRadar ships no analytics, telemetry, third-party scripts, or external CDN/font requests, and never sends Nostr keys or watchlist data to the backend.
      options:
        - label: My proposal does not require breaking any of these guarantees
          required: true
