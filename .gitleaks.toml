title = "MintRadar gitleaks config"

# Extends (not replaces) gitleaks' built-in ruleset — detection stays at full
# strength everywhere except the specific known false positives below.
[extend]
useDefault = true

# backend/.env.example is a template documenting expected env vars with
# placeholder values (e.g. a literal "user:password" DB connection string,
# a commented-out "nsec1..." example) — never real credentials.
[[allowlists]]
paths = [
    '''^MintRadar/backend/\.env\.example$''',
]

# cashuToken.test.ts hardcodes two Cashu ecash proof `secret` fields as fixed
# test fixtures (so token-parsing assertions are deterministic) — these are
# Cashu protocol data, not credentials, but their hex shape/entropy trips the
# generic-api-key rule. Scoped to that one rule/file, not a blanket allow.
# loginWithNsec.test.ts pins the nsec -> public key derivation with the public
# x coordinates of k*G on secp256k1 for k = 1, 2, 3 (the first is the well-known
# generator point) — public constants, not credentials; same scoped allowance.
[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    paths = [
        '''^MintRadar/src/__tests__/cashuToken\.test\.ts$''',
        '''^MintRadar/src/__tests__/loginWithNsec\.test\.ts$''',
    ]

# A database URL with an inline password (postgres://user:PASSWORD@host/db). The built-in rules missed one that sat in
# .github/workflows/deploy.yml in 2026-04 (a 32-character hex password), so this rule is deliberately generic:
# any non-trivial password between "user:" and "@". The entropy floor drops placeholders such as "password",
# "yourpassword" or "STRONG_PASSWORD" (all below 3.5 bits per character) while a random 32-hex value is about 4.
[[rules]]
id = "postgres-url-inline-password"
description = "Database connection URL with an inline password"
regex = '''postgres(?:ql)?://[^:\s/@]+:([^@\s]{8,})@'''
secretGroup = 1
entropy = 3.5
keywords = ["postgres"]

    [[rules.allowlists]]
    stopwords = ["password", "changeme", "change-me", "secret", "example"]

# The three April-2026 commits that held the former finance_user password (it no longer authenticates; checked
# 2026-10-28). They stay in the public history until it is rewritten, so the history scan would flag them forever.
[[allowlists]]
description = "Former Finvu DB password in deploy.yml (already invalid)"
commits = [
    "0230a71b56cd1f3a5391d6fabb975509e2d29368",
    "e1ffff2a1f1471245bc6274c14aaf0365119398a",
    "7b3ebd75770eb1b719fdaf867e7b572931661c83",
]
